---
- name: Set Docker Binary Path
  ansible.builtin.command: which docker
  register: docker_binary_path
  changed_when: false
  failed_when: docker_binary_path.rc != 0
  when: not ansible_check_mode

- name: Set Docker Binary Variable
  ansible.builtin.set_fact:
    docker_binary: "{{ docker_binary_path.stdout | default('/usr/bin/docker') }}"

# check if the lxd user exists and if so, set a variable to use the lxd version of docker
- name: Check if lxd user exists
  ansible.builtin.getent:
    database: passwd
    key: lxd
  register: lxd_user_check
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Create dummy output in check mode for lxd user check
  ansible.builtin.set_fact:
    lxd_user_check: {"ansible_facts": {"getent_passwd": {}}}
  when: ansible_check_mode

# Determine whether the system user exists by inspecting the actual passwd facts.
# If the key is missing, fall back to root so directories are still created without
# trying to chown to a nonexistent account.

- name: Set lxd user to lxd
  ansible.builtin.set_fact:
    lxd_user: lxd
  when:
    - "lxd_user_check.ansible_facts is defined"
    - "lxd_user_check.ansible_facts.getent_passwd is defined"
    - "'lxd' in lxd_user_check.ansible_facts.getent_passwd"

- name: Set lxd user to root since lxd user does not exist
  ansible.builtin.set_fact:
    lxd_user: root
  when:
    - "lxd_user_check.ansible_facts is not defined or lxd_user_check.ansible_facts.getent_passwd is not defined or 'lxd' not in lxd_user_check.ansible_facts.getent_passwd"

# do the same for the docker group
- name: Check if docker group exists
  ansible.builtin.getent:
    database: group
    key: docker
  register: docker_group_check
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Create dummy output in check mode for docker group check
  ansible.builtin.set_fact:
    docker_group_check: {"ansible_facts": {"getent_group": {}}}
  when: ansible_check_mode

- name: Set docker group to docker
  ansible.builtin.set_fact:
    docker_group: docker
  when:
    - "docker_group_check.ansible_facts is defined"
    - "docker_group_check.ansible_facts.getent_group is defined"
    - "'docker' in docker_group_check.ansible_facts.getent_group"

- name: Set docker group to root since docker group does not exist
  ansible.builtin.set_fact:
    docker_group: root
  when:
    - "docker_group_check.ansible_facts is not defined or docker_group_check.ansible_facts.getent_group is not defined or 'docker' not in docker_group_check.ansible_facts.getent_group"
